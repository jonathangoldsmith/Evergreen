[project]
name = "evergreen-harness"
version = "0.1.0"
description = "Recommendation harness for Evergreen: shoes and evidence, on Superlinked SIE and Senso."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sie-sdk>=0.11.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "singlestoredb>=1.20.0",
    "cryptography>=50.0.2",
    "pyjwt>=2.8",
    "h2>=4.1",
]

[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["web: uses web candidates instead of the fake catalog"]
